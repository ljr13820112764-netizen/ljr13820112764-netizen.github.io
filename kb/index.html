<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库图谱 · 刘久瑞作品集</title>
<style>
  :root {
    --bg: #F0F0F0;
    --panel: #FFFFFF;
    --panel-border: #E8E8E8;
    --text: #111111;
    --text-dim: #6A6A6A;
    --accent: #125A8F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
  }
  #graph { flex: 1; height: 100vh; min-width: 0; }

  #sidebar {
    width: 340px; height: 100vh; overflow-y: auto; flex-shrink: 0;
    background: var(--panel); border-right: 1px solid var(--panel-border);
    padding: 18px 16px; display: flex; flex-direction: column; gap: 14px;
  }
  h1 { font-size: 17px; font-weight: 600; letter-spacing: .5px; }
  h1 .sub { font-size: 12px; font-weight: 400; color: var(--text-dim); margin-left: 8px; }
  .stats { font-size: 12px; color: var(--text-dim); line-height: 1.7; }
  .stats b { color: var(--text); font-weight: 600; }

  .section { font-size: 12px; }
  .section h2 {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; color: var(--text-dim); margin-bottom: 8px;
  }

  /* ---- 视图模式按钮组 ---- */
  .btn-group { display: flex; gap: 6px; }
  .btn-group button {
    flex: 1; padding: 6px 0; font-size: 12px; cursor: pointer;
    background: var(--bg); color: var(--text-dim);
    border: 1px solid var(--panel-border); border-radius: 6px;
  }
  .btn-group button:hover { border-color: var(--accent); color: #111111; }
  .btn-group button.active {
    background: #111111; border-color: #111111; color: #FFFFFF;
  }

  /* ---- 搜索 + 建议下拉 ---- */
  .search-wrap { position: relative; }
  #search {
    width: 100%; padding: 8px 10px; font-size: 13px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--panel-border); border-radius: 6px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #suggest {
    position: absolute; top: 36px; left: 0; right: 0; z-index: 20;
    background: #FFFFFF; border: 1px solid var(--panel-border); border-radius: 6px;
    max-height: 260px; overflow-y: auto; display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,.10);
  }
  #suggest.open { display: block; }
  .suggest-item {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 7px 10px; font-size: 12px; border-bottom: 1px solid var(--panel-border);
  }
  .suggest-item:last-child { border-bottom: none; }
  .suggest-item:hover, .suggest-item.sel { background: #F0F0F0; }
  .suggest-item .stype { color: var(--text-dim); font-size: 11px; margin-left: auto; flex-shrink: 0; }

  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .toggle input { accent-color: var(--accent); }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 5px 10px; border-radius: 20px; font-size: 12px;
    border: 1px solid var(--panel-border); user-select: none;
    transition: opacity .15s;
  }
  .filter-chip.off { opacity: .35; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .legend { display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
  .legend-row { display: flex; align-items: center; gap: 8px; }
  .legend .swatch { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }

  #detail { border-top: 1px solid var(--panel-border); padding-top: 12px; }
  #detail .empty { color: var(--text-dim); font-size: 12px; line-height: 1.6; }
  #detail h3 { font-size: 15px; margin-bottom: 8px; word-break: break-all; }
  #detail .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: var(--bg); border: 1px solid var(--panel-border);
  }
  .badge.high { border-color: #125A8F; color: #125A8F; }
  .badge.medium { border-color: #3778A8; color: #3778A8; }
  .badge.low { border-color: #C4C4C4; color: var(--text-dim); }
  .badge.old { border-color: #F0C79A; color: #9A5A12; }
  #detail .summary {
    font-size: 12px; color: var(--text-dim); line-height: 1.7;
    margin-bottom: 10px; word-break: break-all;
  }
  #detail table { width: 100%; font-size: 12px; border-collapse: collapse; }
  #detail td { padding: 3px 0; vertical-align: top; }
  #detail td:first-child { color: var(--text-dim); width: 74px; flex-shrink: 0; }
  #detail td:last-child { word-break: break-all; }
  #detail .rel-title { font-size: 11px; color: var(--text-dim); margin: 10px 0 6px; }
  #detail .rel { display: flex; flex-wrap: wrap; gap: 6px; }
  .rel-chip {
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    padding: 3px 9px; border-radius: 12px; font-size: 11px;
    background: var(--bg); border: 1px solid var(--panel-border);
    max-width: 100%;
  }
  .rel-chip:hover { border-color: var(--accent); color: #111111; }
  .rel-chip .rdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .rel-chip .rname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #detail .actions { display: flex; gap: 8px; margin-top: 12px; }
  #detail button {
    flex: 1; padding: 7px 0; font-size: 12px; cursor: pointer;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--panel-border); border-radius: 6px;
  }
  #detail button:hover { border-color: var(--accent); color: #111111; }
  #detail button.primary { background: #111111; border-color: #111111; color: #FFFFFF; }

  .hint { font-size: 11px; color: var(--text-dim); line-height: 1.8; }

  /* ---- 列表视图 ---- */
  #listPanel { display: none; flex: 1; height: 100vh; min-width: 0; overflow-y: auto; padding: 20px 24px; }
  #listPanel.open { display: block; }
  #listPanel .lgroup { margin-bottom: 18px; }
  #listPanel .lgroup h2 {
    font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--text-dim);
    margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
  }
  #listPanel .lgroup h2 .cnt { font-weight: 400; }
  #listPanel .lcards { display: flex; flex-wrap: wrap; gap: 10px; }
  .lcard {
    width: 260px; padding: 10px 12px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px;
  }
  .lcard:hover { border-color: var(--accent); }
  .lcard .ltop { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
  .lcard .lname { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lcard .lbadge {
    font-size: 10px; padding: 1px 7px; border-radius: 9px; flex-shrink: 0;
    background: var(--bg); border: 1px solid var(--panel-border); color: var(--text-dim);
  }
  .lcard .lbadge.high { border-color: #125A8F; color: #125A8F; }
  .lcard .lbadge.medium { border-color: #3778A8; color: #3778A8; }
  .lcard .lsum {
    font-size: 11px; color: var(--text-dim); line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #111111; border: 1px solid #111111; color: #FFFFFF;
    padding: 8px 16px; border-radius: 8px; font-size: 12px;
    opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; }
</style>
</head>

ration"},{"source":"rag-optimization-strategies","target":"retrieval-augmented-generation"},{"source":"rag-optimization-strategies","target":"chunking"},{"source":"rag-optimization-strategies","target":"text-embedding"},{"source":"rag-optimization-strategies","target":"hybrid-search"},{"source":"rag-optimization-strategies","target":"reranking"},{"source":"rag-optimization-strategies","target":"query-rewriting"},{"source":"rag-optimization-strategies","target":"self-rag"},{"source":"rag-optimization-strategies","target":"rag-fusion"},{"source":"rag-optimization-strategies","target":"prompt-compression"},{"source":"rag-optimization-strategies","target":"knowledge-graph"},{"source":"rag-optimization-strategies","target":"multimodal-rag"},{"source":"rag-optimization-strategies","target":"precision-recall"},{"source":"rag-optimization-strategies","target":"llamaindex"},{"source":"rag-optimization-strategies","target":"llm-wiki-practice"},{"source":"rag-pain-points-solutions","target":"retrieval-augmented-generation"},{"source":"rag-pain-points-solutions","target":"hallucination"},{"source":"rag-pain-points-solutions","target":"chunking"},{"source":"rag-pain-points-solutions","target":"hybrid-search"},{"source":"rag-pain-points-solutions","target":"reranking"},{"source":"rag-pain-points-solutions","target":"query-rewriting"},{"source":"rag-pain-points-solutions","target":"prompt-compression"},{"source":"rag-pain-points-solutions","target":"tabular-data-qa"},{"source":"rag-pain-points-solutions","target":"llamaindex"},{"source":"rag-pain-points-solutions","target":"what-is-rag-pinecone"},{"source":"rag-table-recognition-interview","target":"table-recognition"},{"source":"rag-table-recognition-interview","target":"pdf-parsing"},{"source":"rag-table-recognition-interview","target":"retrieval-augmented-generation"},{"source":"rag-text-chunking-interview","target":"chunking"},{"source":"rag-text-chunking-interview","target":"text-embedding"},{"source":"rag-text-chunking-interview","target":"vector-database"},{"source":"rag-text-chunking-interview","target":"retrieval-augmented-generation"},{"source":"rag-text-chunking-interview","target":"langchain"},{"source":"similarity-functions-interview","target":"similarity-functions"},{"source":"similarity-functions-interview","target":"text-embedding"},{"source":"similarity-functions-interview","target":"machine-learning-basics"},{"source":"software-2-0-karpathy","target":"software-2-0"},{"source":"software-2-0-karpathy","target":"andrej-karpathy"},{"source":"software-2-0-karpathy","target":"from-construction-drawing-to-prd"},{"source":"speech-recognition-basics","target":"speech-recognition"},{"source":"speech-recognition-basics","target":"technical-intuition"},{"source":"speech-recognition-basics","target":"voice-interaction-metrics"},{"source":"transformer-interview-summary","target":"attention-mechanism"},{"source":"transformer-interview-summary","target":"self-attention"},{"source":"transformer-interview-summary","target":"multi-head-attention"},{"source":"transformer-interview-summary","target":"positional-encoding"},{"source":"transformer-interview-summary","target":"transformer"},{"source":"transformer-interview-summary","target":"llm-bible-transformer-foundation"},{"source":"transformers-ops-aigc","target":"transformer"},{"source":"voice-interaction-metrics","target":"speech-recognition"},{"source":"voice-interaction-metrics","target":"speech-synthesis"},{"source":"voice-interaction-metrics","target":"dialogue-system-metrics"},{"source":"voice-interaction-metrics","target":"ai-product-evaluation"},{"source":"voice-interaction-metrics","target":"speech-recognition-basics"},{"source":"what-is-rag-pinecone","target":"retrieval-augmented-generation"},{"source":"what-is-rag-pinecone","target":"hallucination"},{"source":"what-is-rag-pinecone","target":"foundation-model"},{"source":"what-is-rag-pinecone","target":"text-embedding"},{"source":"what-is-rag-pinecone","target":"chunking"},{"source":"what-is-rag-pinecone","target":"pinecone"},{"source":"what-is-rag-pinecone","target":"from-construction-drawing-to-prd"},{"source":"what-is-rag-pinecone","target":"software-2-0-karpathy"},{"source":"yujun-critique-of-methodology","target":"user-value-formula"},{"source":"yujun-critique-of-methodology","target":"user-as-demand-set"},{"source":"yujun-critique-of-methodology","target":"yujun"},{"source":"yujun-critique-of-methodology","target":"yujun-value-formula"},{"source":"yujun-value-formula","target":"user-value-formula"},{"source":"yujun-value-formula","target":"user-as-demand-set"},{"source":"yujun-value-formula","target":"yujun"},{"source":"yujun-value-formula","target":"yujun-critique-of-methodology"}]};

const TYPE_META = {
  concept:  { label: '概念', color: '#125A8F' },
  entity:   { label: '实体', color: '#1F9D6B' },
  source:   { label: '来源', color: '#6A6A6A' },
  synthesis:{ label: '综合', color: '#C26A17' },
};
const CONF_COLOR = { high: '#125A8F', medium: '#3778A8', low: '#68A2C9' };
// 类型分层：概念居中，实体在上，来源在下，综合在顶（z 弱力拉回本层）
const LAYER_Z = { concept: 0, entity: 95, source: -115, synthesis: 190 };
const WIKI_BASE = '';
const FILE_BASE = '';
const VSCODE_BASE = '';

// ---- 预计算：度数 / 邻居 / 重要度 ----
const degreeOf = {};
GRAPH_DATA.nodes.forEach(n => degreeOf[n.id] = 0);
GRAPH_DATA.links.forEach(l => { degreeOf[l.source]++; degreeOf[l.target]++; });
const neighborsOf = {};
GRAPH_DATA.nodes.forEach(n => neighborsOf[n.id] = []);
GRAPH_DATA.links.forEach(l => {
  neighborsOf[l.source].push(l.target);
  neighborsOf[l.target].push(l.source);
});
// 重要度：决定标签遮挡时谁留下、详情里相关节点排序
const importance = n => {
  let v = degreeOf[n.id] * 2;
  if (n.type === 'concept') {
    v += (n.source_count || 0) * 3;
    if (n.confidence === 'high') v += 6;
    if (n.confidence === 'medium') v += 3;
  }
  return v;
};

// ---- 统计 ----
const linkedIds = new Set();
GRAPH_DATA.links.forEach(l => { linkedIds.add(l.source); linkedIds.add(l.target); });
const isolated = GRAPH_DATA.nodes.filter(n => !linkedIds.has(n.id)).length;
const byType = {};
GRAPH_DATA.nodes.forEach(n => byType[n.type] = (byType[n.type] || 0) + 1);
document.getElementById('stats').innerHTML =
  '共 <b>' + GRAPH_DATA.nodes.length + '</b> 个节点（' +
  (byType.concept||0) + ' 概念 / ' + (byType.entity||0) + ' 实体 / ' +
  (byType.source||0) + ' 来源 / ' + (byType.synthesis||0) + ' 综合）<br>' +
  '链接 <b>' + GRAPH_DATA.links.length + '</b> 条 · 孤立节点 <b>' + isolated + '</b> 个';
document.getElementById('gen-date').textContent =
  '生成于 ' + new Date().toLocaleDateString('zh-CN');

// ---- 辅助：节点半径 / 标签颜色 / 文字 sprite ----
const nodeRadius = d => {
  if (d.type === 'concept') return 1.5 + (d.source_count || 0) * 0.9;
  if (d.type === 'source') return d.possibly_outdated ? 2 : 2.5;
  return 4;
};
const labelColor = d => {
  if (d.type === 'concept') return '#0F3F63';
  if (d.type === 'entity') return '#146B4A';
  if (d.type === 'source') return '#5A5A5A';
  return '#8A4A10';
};
const SPRITE_H = 4.5; // 标签世界单位高度
function makeTextSprite(text, color) {
  const canvas = document.createElement('canvas');
  const fontPx = 34;
  const c2d = canvas.getContext('2d');
  c2d.font = '600 ' + fontPx + 'px "Microsoft YaHei", sans-serif';
  const w = c2d.measureText(text).width;
  const pad = 10;
  canvas.width = Math.ceil(w) + pad * 2;
  canvas.height = fontPx + pad * 2;
  c2d.font = '600 ' + fontPx + 'px "Microsoft YaHei", sans-serif';
  c2d.fillStyle = color;
  c2d.textAlign = 'center';
  c2d.textBaseline = 'middle';
  c2d.fillText(text, canvas.width / 2, canvas.height / 2 + 2);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(canvas),
    depthWrite: false, transparent: true,
  }));
  sprite.scale.set(canvas.width / canvas.height * SPRITE_H, SPRITE_H, 1);
  return sprite;
}
// 标签注册表：id -> {node, sprite, ratio}，供遮挡检测
const labelSprites = new Map();
function labelFor(d) {
  const s = makeTextSprite(d.label, labelColor(d));
  s.position.y = nodeRadius(d) + 5.5; // 悬在球体上方
  s.userData.node = d;
  labelSprites.set(d.id, { node: d, sprite: s, ratio: s.scale.x / s.scale.y });
  return s;
}

// ---- 高亮：hover 临时 / 点击持久，共用同一逻辑 ----
// 3d-force-graph 无 highlightNodes/highlightLinks API；用颜色访问器 + 重设刷新实现
let selected = null;
let hovered = null;
let hlNodes = new Set();
let hlLinks = new Set();
function lid(x) { return (x && typeof x === 'object') ? x.id : x; } // 库会把 source/target 改写成节点对象
function applyHl(nodesSet, linksSet) {
  hlNodes = nodesSet;
  hlLinks = linksSet;
  Graph.nodeColor(Graph.nodeColor());
  Graph.linkColor(Graph.linkColor());
}
function setHighlight(node) {
  if (!node) { applyHl(new Set(), new Set()); return; }
  const nb = new Set(neighborsOf[node.id] || []);
  nb.add(node.id);
  applyHl(nb, new Set(GRAPH_DATA.links
    .filter(l => lid(l.source) === node.id || lid(l.target) === node.id)));
}

// ---- 布局：分层弱力 + 向心力 + 更散的间距 ----
let flat2D = false;
const layoutForce = alpha => {
  for (const n of GRAPH_DATA.nodes) {
    const zTarget = flat2D ? 0 : LAYER_Z[n.type];
    n.vz += (zTarget - n.z) * alpha * 0.32;
    n.vx += (0 - n.x) * alpha * 0.006;
    n.vy += (0 - n.y) * alpha * 0.006;
  }
};

// ---- 图谱 ----
let showLabels = true;
const Graph = ForceGraph3D()(document.getElementById('graph'))
  .backgroundColor('#F0F0F0')
  .graphData(GRAPH_DATA)
  .nodeVal(nodeRadius)
  .nodeColor(d => {
    if (hlNodes.size && !hlNodes.has(d.id)) return '#C4C4C4';
    if (d.type === 'concept') return CONF_COLOR[d.confidence] || CONF_COLOR.low;
    if (d.type === 'source' && d.possibly_outdated) return '#C4C4C4';
    return TYPE_META[d.type].color;
  })
  .nodeLabel(d => d.label + '（' + TYPE_META[d.type].label + '）')
  .nodeThreeObject(d => showLabels ? labelFor(d) : null)
  .nodeResolution(16)
  .linkColor(l => (hlNodes.size && !hlLinks.has(l)) ? 'rgba(17,17,17,0.04)' : 'rgba(17,17,17,0.18)')
  .linkWidth(0.6)
  .linkOpacity(0.5)
  .onNodeHover(node => {
    document.getElementById('graph').style.cursor = node ? 'pointer' : 'default';
    hovered = node;
    setHighlight(node || selected); // 移出后恢复点击态高亮
  })
  .onNodeClick(node => selectNode(node))
  .onBackgroundClick(() => selectNode(null));

// 力导向参数：d3Force(name) 返回 force 对象而非图对象，必须独立调用
Graph.d3Force('charge').strength(-130);
Graph.d3Force('link').distance(90);
Graph.d3Force('layoutForce', layoutForce);

// 锁定模式：OrbitControls 只缩放/平移，不旋转
const controls = Graph.controls();
controls.enableRotate = false;
controls.autoRotate = false;

// ---- 统一选中：高亮 + 详情 + 聚焦 ----
function selectNode(node) {
  selected = node;
  setHighlight(node);
  showDetail(node);
  if (node) focusNode(node);
}

// ---- 标签遮挡检测：屏幕投影 + 贪心保留重要标签 ----
let tickCount = 0;
function occlusionPass() {
  if (!showLabels) return;
  const items = [...labelSprites.values()];
  items.sort((a, b) => importance(b.node) - importance(a.node));
  const kept = [];
  for (const it of items) {
    const box = screenBox(it);
    const pinned = it.node === selected || it.node === hovered;
    if (!box) { it.sprite.visible = false; continue; }
    const overlap = kept.some(k => boxesOverlap(k, box));
    it.sprite.visible = pinned || !overlap;
    if (it.sprite.visible) kept.push(box);
  }
}
function screenBox(it) {
  const n = it.node;
  const anchor = Graph.graph2ScreenCoords(n.x, n.y + nodeRadius(n) + 5.5, n.z);
  const top = Graph.graph2ScreenCoords(n.x, n.y + nodeRadius(n) + 5.5 + SPRITE_H, n.z);
  if (!anchor || !top) return null;
  const h = Math.abs(top.y - anchor.y);
  const w = h * it.ratio;
  return { x: anchor.x - w / 2, y: anchor.y - h, w, h };
}
function boxesOverlap(a, b) {
  const pad = 6;
  return a.x < b.x + b.w + pad && a.x + a.w + pad > b.x &&
         a.y < b.y + b.h + pad && a.y + a.h + pad > b.y;
}
Graph.onEngineTick(() => {
  if (++tickCount % 5 === 0) occlusionPass(); // 每 5 帧一次避让检测
});

// ---- 标签开关 ----
document.getElementById('showLabels').addEventListener('change', e => {
  showLabels = e.target.checked;
  if (!showLabels) labelSprites.clear();
  Graph.nodeThreeObject(d => showLabels ? labelFor(d) : null);
});

// ---- 自动旋转 ----
document.getElementById('autoRotate').addEventListener('change', e => {
  controls.autoRotate = e.target.checked && viewMode === 'free';
});

// ---- 视角模式：锁定 / 旋转 / 俯视 / 复位 ----
let viewMode = 'lock';
function setMode(mode) {
  viewMode = mode;
  if (mode === 'top') {
    flat2D = true;
    controls.enableRotate = false;
    controls.autoRotate = false;
    document.getElementById('autoRotate').checked = false;
    setTimeout(() => { // 等 z 力把图压平后，从正上方适配
      Graph.zoomToFit(400, 30);
      const dist = Graph.camera().position.length();
      Graph.cameraPosition({ x: 0, y: 0, z: dist }, { x: 0, y: 0, z: 0 }, 500);
    }, 350);
  } else {
    flat2D = false;
    controls.enableRotate = mode === 'free';
    controls.autoRotate = mode === 'free' && document.getElementById('autoRotate').checked;
  }
  ['mLock','mFree','mTop'].forEach(id => {
    document.getElementById(id).classList.toggle('active', id === 'm' + mode[0].toUpperCase() + mode.slice(1));
  });
  if (mode === 'top') { // 俯视时相机从上方看
    setTimeout(() => Graph.zoomToFit(400, 30), 400);
  }
}
document.getElementById('mLock').onclick = () => setMode('lock');
document.getElementById('mFree').onclick = () => setMode('free');
document.getElementById('mTop').onclick = () => setMode('top');
document.getElementById('mReset').onclick = () => {
  flat2D = false;
  controls.enableRotate = false;
  controls.autoRotate = false;
  document.getElementById('autoRotate').checked = false;
  viewMode = 'lock';
  ['mLock','mFree','mTop'].forEach(id => {
    document.getElementById(id).classList.toggle('active', id === 'mLock');
  });
  Graph.zoomToFit(400, 60);
};

// ---- 图谱 / 列表视图切换 ----
function switchView(v) {
  const isList = v === 'list';
  document.getElementById('graph').style.display = isList ? 'none' : '';
  document.getElementById('listPanel').classList.toggle('open', isList);
  document.getElementById('vGraph').classList.toggle('active', !isList);
  document.getElementById('vList').classList.toggle('active', isList);
  if (isList) renderList();
}
document.getElementById('vGraph').onclick = () => switchView('graph');
document.getElementById('vList').onclick = () => switchView('list');

// ---- 列表视图：按类型分组，点击直达节点 ----
const GROUP_ORDER = ['concept', 'entity', 'synthesis', 'source'];
function renderList() {
  const groups = { concept: [], entity: [], source: [], synthesis: [] };
  GRAPH_DATA.nodes.forEach(n => groups[n.type].push(n));
  groups.concept.sort((a, b) => importance(b) - importance(a));
  ['entity','source','synthesis'].forEach(t =>
    groups[t].sort((a, b) => a.label.localeCompare(b.label, 'zh')));
  document.getElementById('listPanel').innerHTML = GROUP_ORDER.map(t => {
    const list = groups[t];
    if (!list.length) return '';
    return '<div class="lgroup"><h2><span class="dot" style="background:' +
      TYPE_META[t].color + '"></span>' + TYPE_META[t].label +
      '<span class="cnt">· ' + list.length + '</span></h2><div class="lcards">' +
      list.map(n => {
        let badge = '';
        if (n.type === 'concept' && n.confidence) {
          badge = '<span class="lbadge ' + n.confidence + '">' + n.confidence + '</span>';
        }
        if (n.possibly_outdated) badge += '<span class="lbadge old">可能过时</span>';
        return '<div class="lcard" onclick="selectNodeById(\'' + n.id + '\')">' +
          '<div class="ltop"><span class="dot" style="background:' +
          (n.type === 'concept' ? (CONF_COLOR[n.confidence] || CONF_COLOR.low) :
           (n.type === 'source' && n.possibly_outdated ? '#C4C4C4' : TYPE_META[n.type].color)) +
          ';flex-shrink:0"></span><span class="lname">' + escapeHtml(n.label) +
          '</span>' + badge + '</div>' +
          (n.summary ? '<div class="lsum">' + escapeHtml(n.summary) + '</div>' : '') + '</div>';
      }).join('') + '</div></div>';
  }).join('');
}
const nodeById = {};
GRAPH_DATA.nodes.forEach(n => nodeById[n.id] = n);
function selectNodeById(id) {
  const n = nodeById[id];
  if (!n) return;
  switchView('graph');
  selectNode(n);
}
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---- 搜索：即时建议下拉 ----
const searchBox = document.getElementById('search');
const suggestBox = document.getElementById('suggest');
let suggestSel = -1;
function searchHits(q) {
  q = q.toLowerCase();
  return GRAPH_DATA.nodes.filter(n =>
    n.id.toLowerCase().includes(q) ||
    n.label.toLowerCase().includes(q) ||
    (n.aliases || []).some(a => a.toLowerCase().includes(q)) ||
    (n.tags || []).some(t => t.toLowerCase().includes(q))
  ).sort((a, b) => importance(b) - importance(a)).slice(0, 8);
}
let composing = false;
searchBox.addEventListener('compositionstart', () => composing = true);
searchBox.addEventListener('compositionend', () => { composing = false; onSearchInput(); });
function onSearchInput() {
  if (composing) return;
  const q = searchBox.value.trim();
  suggestSel = -1;
  if (!q) {
    suggestBox.classList.remove('open');
    applyHl(new Set(), new Set());
    return;
  }
  const hits = searchHits(q);
  suggestBox.innerHTML = hits.map((n, i) =>
    '<div class="suggest-item" data-id="' + n.id + '" data-i="' + i + '">' +
    '<span class="dot" style="background:' +
    (n.type === 'concept' ? (CONF_COLOR[n.confidence] || CONF_COLOR.low) :
     (n.type === 'source' && n.possibly_outdated ? '#C4C4C4' : TYPE_META[n.type].color)) +
    '"></span><span>' + escapeHtml(n.label) +
    '</span><span class="stype">' + TYPE_META[n.type].label + '</span></div>'
  ).join('') || '<div class="suggest-item">无匹配</div>';
  suggestBox.classList.add('open');
  // 图谱上同时高亮命中
  const ids = new Set(hits.map(n => n.id));
  applyHl(ids, new Set(GRAPH_DATA.links.filter(l =>
    ids.has(lid(l.source)) && ids.has(lid(l.target)))));
}
searchBox.addEventListener('input', onSearchInput);
suggestBox.addEventListener('click', e => {
  const item = e.target.closest('.suggest-item');
  if (!item || !item.dataset.id) return;
  searchBox.value = '';
  suggestBox.classList.remove('open');
  selectNode(nodeById[item.dataset.id]);
});
searchBox.addEventListener('keydown', e => {
  const items = [...suggestBox.querySelectorAll('.suggest-item[data-id]')];
  if (!items.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    suggestSel = e.key === 'ArrowDown'
      ? Math.min(suggestSel + 1, items.length - 1)
      : Math.max(suggestSel - 1, 0);
    items.forEach((el, i) => el.classList.toggle('sel', i === suggestSel));
  } else if (e.key === 'Enter' && suggestSel >= 0) {
    e.preventDefault();
    items[suggestSel].click();
  } else if (e.key === 'Escape') {
    suggestBox.classList.remove('open');
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) suggestBox.classList.remove('open');
});

// ---- 类型筛选 ----
const visible = new Set(Object.keys(TYPE_META));
const filtersBox = document.getElementById('filters');
Object.entries(TYPE_META).forEach(([type, meta]) => {
  const chip = document.createElement('span');
  chip.className = 'filter-chip';
  chip.innerHTML = '<span class="dot" style="background:' + meta.color + '"></span>' + meta.label;
  chip.onclick = () => {
    visible.has(type) ? visible.delete(type) : visible.add(type);
    chip.classList.toggle('off', !visible.has(type));
    Graph.nodeVisibility(d => visible.has(d.type));
  };
  filtersBox.appendChild(chip);
});
Graph.nodeVisibility(d => visible.has(d.type));

// ---- 节点详情 ----
function showDetail(node) {
  const box = document.getElementById('detail');
  if (!node) {
    box.innerHTML = '<div class="empty">点击图谱或列表中的节点查看详情。滚轮缩放 · 拖拽平移 · 点击高亮关联。</div>';
    return;
  }
  const rows = [];
  const addRow = (k, v) => { if (v !== '' && v != null) rows.push('<tr><td>' + k + '</td><td>' + v + '</td></tr>'); };
  let badges = '<span class="badge">' + TYPE_META[node.type].label + '</span>';
  if (node.confidence) badges += '<span class="badge ' + node.confidence + '">confidence: ' + node.confidence + '</span>';
  if (node.type === 'concept') badges += '<span class="badge">' + (node.source_count || 0) + ' 来源</span>';
  if (node.possibly_outdated) badges += '<span class="badge old">可能过时</span>';
  if (node.entity_type) badges += '<span class="badge">' + node.entity_type + '</span>';

  const abs = WIKI_BASE + node.path;
  const fileUrl = FILE_BASE + node.path.split('/').map(encodeURIComponent).join('/');
  const vscUrl = VSCODE_BASE + node.path.split('/').map(encodeURIComponent).join('/');
  addRow('slug', node.id);
  if ((node.aliases || []).length) addRow('别名', node.aliases.join(' · '));
  if ((node.tags || []).length) addRow('标签', node.tags.join(' · '));
  if (node.date) addRow('日期', node.date);
  addRow('路径', node.path);

  // 相关节点：按重要度排序，点击跳转
  const rel = [...new Set(neighborsOf[node.id])]
    .map(id => nodeById[id]).filter(Boolean)
    .sort((a, b) => importance(b) - importance(a)).slice(0, 12);
  const relHtml = rel.length
    ? '<div class="rel-title">相关节点（' + degreeOf[node.id] + ' 个，点击跳转）</div><div class="rel">' +
      rel.map(r => '<span class="rel-chip" data-rid="' + r.id + '">' +
        '<span class="rdot" style="background:' +
        (r.type === 'concept' ? (CONF_COLOR[r.confidence] || CONF_COLOR.low) :
         (r.type === 'source' && r.possibly_outdated ? '#C4C4C4' : TYPE_META[r.type].color)) +
        '"></span><span class="rname">' + escapeHtml(r.label) + '</span></span>').join('') +
      '</div>'
    : '';

  box.innerHTML =
    '<h3>' + escapeHtml(node.label) + '</h3>' +
    '<div class="meta">' + badges + '</div>' +
    (node.summary ? '<div class="summary">' + escapeHtml(node.summary) + '</div>' : '') +
    '<table>' + rows.join('') + '</table>' +
    relHtml +
    '';
  box.querySelectorAll('.rel-chip').forEach(chip => {
    chip.onclick = () => selectNode(nodeById[chip.dataset.rid]);
  });
}

function focusNode(node) {
  if (!node) return;
  const dist = 70;
  const angle = Math.PI / 3;
  Graph.cameraPosition(
    { x: node.x + dist, y: node.y + dist * Math.sin(angle), z: node.z + dist * Math.cos(angle) },
    node, 900);
}

function copyPath(btn, text) {
  const done = () => { toast('已复制：' + text); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// 初始视角：锁定模式 + 适配全图
setTimeout(() => Graph.zoomToFit(400, 60), 800);
window.addEventListener('resize', () => {
  Graph.width(window.innerWidth - 340).height(window.innerHeight);
});
